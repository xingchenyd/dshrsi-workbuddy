<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">受控机制实测：12 次缺失命令请求，失败启动从 12 次降至 5 次</title>
<desc id="desc">数据来自 docs/workbuddy/benchmarks/results.json。RSI 关闭时，12 次失败启动；开启时，5 次失败启动、7 次执行前拒绝。两组各 4 次健康调用均成功。固定输入序列，真实本地进程尝试，不含模型调用，不是任务成功率评估。</desc>
<rect width="1200" height="660" rx="24" fill="#F4F6EF"/>
<g font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif">
 <text x="48" y="56" font-size="18" font-weight="600" letter-spacing="1.4" fill="#4E7468">CONTROLLED BENCHMARK</text>
 <text x="48" y="108" font-size="34" font-weight="700" fill="#183B35">同样的 12 次请求，少了 7 次失败启动</text>
 <text x="48" y="145" font-size="20" fill="#60726A">固定输入序列 · 真实本地进程尝试 · 无模型调用</text>
 <rect x="48" y="178" width="1104" height="238" rx="16" fill="#FFFFFF" stroke="#D8E2D7"/>
 <text x="78" y="216" font-size="18" fill="#566F66">缺失可执行命令请求（每组 12 次）</text>
 <rect x="753" y="199" width="18" height="18" rx="4" fill="#B77056"/>
 <text x="781" y="215" font-size="18" fill="#566F66">实际失败启动</text>
 <rect x="955" y="199" width="18" height="18" rx="4" fill="#428D71"/>
 <text x="983" y="215" font-size="18" fill="#566F66">执行前拒绝</text>
 <text x="78" y="269" font-size="21" font-weight="600" fill="#384F47">RSI 关闭</text>
 <rect x="228" y="241" width="876" height="42" rx="6" fill="#B77056"/>
 <text x="666" y="269" text-anchor="middle" font-size="21" font-weight="600" fill="#FFFFFF">12 次失败启动</text>
 <text x="78" y="333" font-size="21" font-weight="600" fill="#183B35">RSI 开启</text>
 <rect x="228" y="305" width="365" height="42" rx="6" fill="#B77056"/>
 <rect x="593" y="305" width="511" height="42" rx="6" fill="#428D71"/>
 <text x="410" y="333" text-anchor="middle" font-size="21" font-weight="600" fill="#FFFFFF">5 次失败启动</text>
 <text x="848" y="333" text-anchor="middle" font-size="21" font-weight="600" fill="#FFFFFF">7 次执行前拒绝</text>
 <text x="78" y="385" font-size="19" fill="#60726A">健康调用：两组均 4 / 4 成功，未误拦。开启组的探测性重试已计入失败数。</text>
 <rect x="48" y="440" width="538" height="152" rx="16" fill="#E5EEE4"/>
 <text x="76" y="477" font-size="22" font-weight="700" fill="#254E3F">重开 host 后，规则仍保留</text>
 <text x="76" y="510" font-size="18" fill="#4D695B">独立场景：各学习 2 次失败后重启 host</text>
 <text x="76" y="539" font-size="18" fill="#4D695B">开启组：1 条规则保留，新会话上下文出现</text>
 <text x="76" y="568" font-size="18" fill="#4D695B">含学习成本的失败启动：关闭 8 次 / 开启 5 次</text>
 <rect x="610" y="440" width="542" height="152" rx="16" fill="#E6ECEA"/>
 <text x="638" y="477" font-size="22" font-weight="700" fill="#254E47">修改之后，要求先验证</text>
 <text x="638" y="510" font-size="18" fill="#4D6961">开启组阻止未验证的 Stop，并要求续跑</text>
 <text x="638" y="539" font-size="18" fill="#4D6961">两组真实 node --check 均通过，之后可结束</text>
 <text x="638" y="568" font-size="18" fill="#4D6961">验证请求生效 ≠ 证明任意修改都正确</text>
 <text x="48" y="630" font-size="18" fill="#60726A">证据边界：机制验证，不是 WorkBuddy 桌面模型任务成功率、耗时或 Token 节省评估。</text>
</g>
</svg>
